name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  contracts:
    name: forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge build
        run: forge build --sizes
      - name: forge test
        run: forge test -vv
      - name: gate.sh is syntactically valid
        run: bash -n gate.sh

  classifier:
    name: off-chain classifier self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # analyzer + headline run over the compiled artifacts, so build first.
      - run: forge build
      - name: off-chain self-test (keccak, static policy, headline tally)
        run: node script/test.mjs
      - name: headline (offline, deterministic)
        run: node script/headline.mjs
