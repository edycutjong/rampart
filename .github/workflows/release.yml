name: release

# Automatic semantic versioning. Every push to main that carries a releasable commit
# gets a tag and a GitHub Release with generated notes.
#
# WHY TAG-ONLY, AND NO COMMIT-BACK. Tools that bump package.json and push the bump
# create a second commit, which re-triggers CI and can loop. This workflow only ever
# creates a tag and a Release — it never writes to the branch — so it cannot loop and
# cannot race a human push. `package.json` carries the version for the npm package;
# the tag is the source of truth for a release.
#
# BUMP RULES (conventional commits, plus this repo's own prefixes):
#   major  a commit with `!` before the colon, or `BREAKING CHANGE` in the body
#   minor  feat | engine | analyzer | sdk | site | onchain   (new capability)
#   patch  fix | perf | docs | test | ci | chore | refactor  (everything else)
# A push whose commits are ALL chore/ci/docs still gets a patch release, because the
# published site and the judge-facing docs are part of what this repo ships.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']      # a pure docs edit does not need its own version
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force a specific bump'
        required: false
        default: 'auto'
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write                   # required to create tags and releases

concurrency:
  group: release-${{ github.ref }}  # never two releases racing for the same next version
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history + tags, or "commits since last tag" is wrong

      - name: Work out the next version
        id: v
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")

          if [ -z "$LAST" ]; then
            # First release. Start at 1.0.0 rather than 0.1.0: the contracts are
            # deployed on Shannon and the API is public, so this is not a preview.
            NEXT="1.0.0"
            RANGE=""
            echo "no previous tag — bootstrapping at v$NEXT"
          else
            RANGE="${LAST}..HEAD"
            COMMITS=$(git log --format='%s%n%b' "$RANGE")
            if [ -z "$(git log --format='%H' "$RANGE")" ]; then
              echo "no commits since $LAST — nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi

            BUMP="patch"
            if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$COMMITS" || grep -q 'BREAKING CHANGE' <<<"$COMMITS"; then
              BUMP="major"
            elif grep -qE '^(feat|engine|analyzer|sdk|site|onchain)(\([^)]*\))?:' <<<"$COMMITS"; then
              BUMP="minor"
            fi
            [ "${{ inputs.bump }}" != "" ] && [ "${{ inputs.bump }}" != "auto" ] && BUMP="${{ inputs.bump }}" || true

            IFS=. read -r MA MI PA <<<"${LAST#v}"
            case "$BUMP" in
              major) NEXT="$((MA+1)).0.0" ;;
              minor) NEXT="${MA}.$((MI+1)).0" ;;
              *)     NEXT="${MA}.${MI}.$((PA+1))" ;;
            esac
            echo "last=$LAST  bump=$BUMP  next=v$NEXT"
          fi

          echo "next=$NEXT"   >> "$GITHUB_OUTPUT"
          echo "last=$LAST"   >> "$GITHUB_OUTPUT"
          echo "skip=false"   >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.v.outputs.next }}
          LAST: ${{ steps.v.outputs.last }}
        run: |
          set -euo pipefail
          # An annotated tag needs a committer identity; the runner has none, and
          # `git tag -a` dies with "empty ident name" rather than falling back.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "v$NEXT already exists — nothing to do"; exit 0
          fi
          git tag -a "v$NEXT" -m "v$NEXT"
          git push origin "v$NEXT"
          if [ -n "$LAST" ]; then
            gh release create "v$NEXT" --title "v$NEXT" --generate-notes --notes-start-tag "$LAST"
          else
            gh release create "v$NEXT" --title "v$NEXT" --generate-notes
          fi
          echo "released v$NEXT"
