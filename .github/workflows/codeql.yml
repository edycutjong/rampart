name: codeql

# CodeQL has no Solidity extractor, so this covers the off-chain half of the
# project: the JSON-RPC client, the keccak implementation, the static bytecode
# analyzer, and the classifier — everything under script/. Solidity is covered
# by slither in security.yml, and by 70 forge tests.

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
